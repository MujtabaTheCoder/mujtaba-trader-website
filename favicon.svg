<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="50%" stop-color="#d4941a"/>
      <stop offset="100%" stop-color="#b8760f"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#e8b830"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer hexagon -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="none" stroke="url(#g1)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Inner hexagon -->
  <polygon points="32,10 50,20 50,44 32,54 14,44 14,20" fill="none" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
  <!-- M letter -->
  <text x="32" y="40" text-anchor="middle" fill="url(#g2)" font-family="Arial,sans-serif" font-weight="900" font-size="30" letter-spacing="-1">M</text>
</svg>
